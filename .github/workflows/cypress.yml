name: TASKFLOW-API - Cypress E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ---------- CHECKOUT FRONTEND (ce dépôt) ----------
      - name: Checkout du frontend (Angular)
        uses: actions/checkout@v4
        with:
          path: frontend

      # ---------- CHECKOUT BACKEND (dépôt séparé) ----------
      - name: Checkout du backend (Spring Boot)
        uses: actions/checkout@v4
        with:
          repository: https://github.com/elattarynoha/TASKFLOW-API  # <-- remplace TON_ORG_OU_USER
          path: backend
          # Décommente si le repo backend est PRIVÉ :
          # token: ${{ secrets.BACKEND_REPO_TOKEN }}

      # ---------- BACKEND (Spring Boot) ----------
      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build du backend Spring Boot
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: Démarrage du backend Spring Boot
        working-directory: ./backend
        env:
          # Ces variables surchargent application.properties automatiquement (relaxed binding Spring Boot)
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow_ci
          SPRING_DATASOURCE_USERNAME: taskflow
          SPRING_DATASOURCE_PASSWORD: taskflow
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: nohup mvn spring-boot:run > ../backend.log 2>&1 &

      - name: Attente que le backend soit prêt (port 8080)
        run: npx wait-on tcp:localhost:8080 -t 120000

      # ---------- FRONTEND (Angular) ----------
      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installation des dépendances Angular
        working-directory: ./frontend
        run: npm ci

      # ---------- CYPRESS ----------
      - name: Exécution des tests Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          start: npm start
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
          browser: chrome

      - name: Upload des screenshots (si échec)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload des vidéos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          if-no-files-found: ignore

      - name: Logs backend (debug en cas d'échec)
        if: failure()
        run: cat backend.log
