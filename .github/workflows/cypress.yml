name: TASKFLOW-API - Cypress E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgresql123
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ---------- CHECKOUT FRONTEND (ce dépôt) ----------
      - name: Checkout du frontend (Angular)
        uses: actions/checkout@v4
        with:
          path: frontend

      # ---------- CHECKOUT BACKEND (dépôt séparé) ----------
      - name: Checkout du backend (Spring Boot)
        uses: actions/checkout@v4
        with:
          repository: elattarynoha/TASKFLOW-API
          path: backend

      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: './backend/pom.xml'

      - name: Build du backend Spring Boot
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: Démarrage du backend Spring Boot
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgresql123
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_JPA_SHOW_SQL: "true"
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
          SPRING_JPA_OPEN_IN_VIEW: "false"
        run: |
          nohup mvn spring-boot:run > ../backend.log 2>&1 &
          sleep 5

      - name: Attente que le backend soit prêt (port 8080)
        run: npx wait-on tcp:localhost:8080 -t 120000 --delay 1000

      # ---------- FRONTEND (Angular) ----------
      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installation des dépendances Angular
        working-directory: ./frontend
        run: npm ci

      # ---------- CYPRESS ----------
      - name: Exécution des tests Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          start: npm start
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
          browser: chrome

      - name: Upload des screenshots (si échec)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload des vidéos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          if-no-files-found: ignore

      - name: Logs backend (debug en cas d'échec)
        if: failure()
        run: cat backend.log