<div class="auth-container">
  <div class="auth-card">
    <h1>Create your TaskFlow account</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" [(ngModel)]="fullName" required placeholder="Jane Doe" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••" />
      </div>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>
